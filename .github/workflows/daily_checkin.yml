name: Daily NodeSeek Check-In

on:
  schedule:
    - cron: '23 1,2 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 打印实际运行时间
        run: |
          echo "UTC时间: $(date -u) | 北京时间: $(TZ=Asia/Shanghai date)"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run check-in
        env:
          NS_COOKIES: ${{ secrets.NS_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NS_RANDOM: true    # 签到模式：true = 试试手气，false = 固定鸡腿（默认 true）
        run: python checkin.py

      
      
